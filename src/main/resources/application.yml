# =============================================================================
# Audit Log Service — base configuration (scaffolding stage)
#
# This file is COMMITTED and MUST NOT contain secrets. Every sensitive value is
# an environment-variable placeholder with a safe, non-secret local default that
# only works against the local Docker Compose PostgreSQL. Real credentials for any
# non-local environment come from the environment or from a git-ignored
# application-local.yml (see application-local.yml.example).
#
# NOTE: No database schema is created in this step. There are no Flyway migrations
# and no JPA entities yet, so schema management is intentionally inert.
# =============================================================================

spring:
  application:
    name: audit-log-service

  datasource:
    # Defaults target the local Docker Compose PostgreSQL (see docker-compose.yml).
    # The default password below is a LOCAL-ONLY development value, not a secret.
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit}
    username: ${AUDIT_DB_USERNAME:audit}
    password: ${AUDIT_DB_PASSWORD:audit_local_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'none': we do NOT let Hibernate create/alter tables. Schema will be owned by
      # Flyway migrations in a later step. No tables are created now.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Flyway manages the schema. As of V1 there IS a migration
    # (db/migration/V1__create_audit_chain_foundation.sql); on startup Flyway
    # applies any pending migrations and records them in flyway_schema_history.
    enabled: true
    # baseline-on-migrate stays false; the schema is created entirely by Flyway.

server:
  port: ${AUDIT_SERVER_PORT:8080}

# springdoc / Swagger UI is on the classpath for later API documentation.
# Left at defaults; documented endpoints will appear once controllers exist.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# -----------------------------------------------------------------------------
# API-key -> role mappings. Keys come from ENVIRONMENT VARIABLES — NO real keys are
# committed here. If a variable is unset the entry resolves to an empty key and is
# skipped, so the endpoint is simply inaccessible until a real key is provided.
# The client sends only X-API-Key; the role is resolved server-side.
audit:
  security:
    api-keys:
      - key: ${AUDIT_WRITER_KEY:}
        role: WRITER
      - key: ${AUDIT_COMPLIANCE_KEY:}
        role: COMPLIANCE_READER
      - key: ${AUDIT_ADMIN_KEY:}
        role: ADMIN
  # Compliance: which resourceType denotes client-account data (Scenario C in-scope slice).
  compliance:
    client-account-resource-type: ${AUDIT_CLIENT_ACCOUNT_RESOURCE_TYPE:CLIENT_ACCOUNT}

  # Export signing (Ed25519). The PRIVATE key path comes from the environment / a mounted
  # secret and is NEVER committed. If unset, the service uses an EPHEMERAL non-production dev key
  # (a warning is logged) so export works out-of-the-box for local/demo use.
  export:
    private-key-path: ${AUDIT_EXPORT_PRIVATE_KEY_PATH:}   # Ed25519 PKCS#8 PEM — never commit the private key
    public-key-path:  ${AUDIT_EXPORT_PUBLIC_KEY_PATH:}    # Ed25519 X.509 PEM — public key may be committed
    signing-key-id:   ${AUDIT_EXPORT_SIGNING_KEY_ID:audit-export-key-dev}
# -----------------------------------------------------------------------------

logging:
  level:
    root: INFO
