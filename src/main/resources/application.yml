# =============================================================================
# Audit Log Service — base configuration
#
# This file is COMMITTED and MUST NOT contain secrets. Every sensitive value is
# an environment-variable placeholder with a safe, non-secret local default that
# only works against the local Docker Compose PostgreSQL. Real credentials for any
# non-local environment come from the environment or from a git-ignored
# application-local.yml (see application-local.yml.example).
# =============================================================================

spring:
  application:
    name: audit-log-service

  datasource:
    # Defaults target the local Docker Compose PostgreSQL (see docker-compose.yml).
    # The default password below is a LOCAL-ONLY development value, not a secret.
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit}
    username: ${AUDIT_DB_USERNAME:audit}
    password: ${AUDIT_DB_PASSWORD:audit_local_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'none': Hibernate never creates/alters tables. The schema is owned entirely by
      # Flyway migrations (db/migration/V1–V3).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Flyway owns the schema (migrations V1–V3 under db/migration); on startup it applies
    # any pending migrations and records them in flyway_schema_history.
    enabled: true
    # baseline-on-migrate stays false; the schema is created entirely by Flyway.

server:
  port: ${AUDIT_SERVER_PORT:8080}
  # Fail-closed error responses: never expose the exception message, stack trace, or binding
  # details to clients. These are already the Spring Boot defaults; pinned explicitly so a future
  # default change cannot silently start leaking internals.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  # Forwarded headers are NOT trusted by default. Trusting X-Forwarded-* without a trusted proxy
  # in front lets a client spoof its address/scheme. Enable ONLY behind a proxy that overwrites
  # inbound forwarding headers, via the 'proxy' profile (application-proxy.yml).
  forward-headers-strategy: none

# springdoc / Swagger UI. Enablement tracks audit.docs.enabled so the docs surface is off by
# default (and, when on, its authorization is governed by audit.docs.public in SecurityConfig).
springdoc:
  api-docs:
    enabled: ${audit.docs.enabled:false}
  swagger-ui:
    enabled: ${audit.docs.enabled:false}

# -----------------------------------------------------------------------------
# API-key -> role mappings. Keys come from ENVIRONMENT VARIABLES — NO real keys are
# committed here. If a variable is unset the entry resolves to an empty key and is
# skipped, so the endpoint is simply inaccessible until a real key is provided.
# The client sends only X-API-Key; the role is resolved server-side.
audit:
  security:
    api-keys:
      - key: ${AUDIT_WRITER_KEY:}
        role: WRITER
      - key: ${AUDIT_COMPLIANCE_KEY:}
        role: COMPLIANCE_READER
      - key: ${AUDIT_ADMIN_KEY:}
        role: ADMIN
  # Request/security hardening bounds (Commit A). Defaults comfortably fit legitimate audit
  # events; oversized or pathologically-nested bodies are rejected before parsing/persisting.
  limits:
    max-request-bytes: ${AUDIT_MAX_REQUEST_BYTES:65536}          # 64 KiB raw body cap (413 over)
    max-json-depth: ${AUDIT_MAX_JSON_DEPTH:32}                   # JSON nesting depth (400 over)
    max-json-string-length: ${AUDIT_MAX_JSON_STRING_LENGTH:65536}
    max-json-number-length: ${AUDIT_MAX_JSON_NUMBER_LENGTH:128}
    max-redactable-fields: ${AUDIT_MAX_REDACTABLE_FIELDS:64}
    max-redactable-field-path-length: ${AUDIT_MAX_REDACTABLE_FIELD_PATH_LENGTH:128}

  # OpenAPI/Swagger exposure. Fail-closed by default: not served, not public. The 'local' profile
  # turns it on and makes it public for developer convenience. If enabled but not public, the docs
  # require ADMIN (see SecurityConfig). 'public' is a YAML reserved-looking key but binds fine to
  # HardeningProperties.Docs.setPublic.
  docs:
    enabled: ${AUDIT_DOCS_ENABLED:false}
    public: ${AUDIT_DOCS_PUBLIC:false}

  # Compliance: which resourceType denotes client-account data (Scenario C in-scope slice).
  compliance:
    client-account-resource-type: ${AUDIT_CLIENT_ACCOUNT_RESOURCE_TYPE:CLIENT_ACCOUNT}

  # Export signing (Ed25519). The PRIVATE key path comes from the environment / a mounted
  # secret and is NEVER committed. If unset, the service uses an EPHEMERAL non-production dev key
  # (a warning is logged) so export works out-of-the-box for local/demo use.
  export:
    private-key-path: ${AUDIT_EXPORT_PRIVATE_KEY_PATH:}   # Ed25519 PKCS#8 PEM — never commit the private key
    public-key-path:  ${AUDIT_EXPORT_PUBLIC_KEY_PATH:}    # Ed25519 X.509 PEM — public key may be committed
    signing-key-id:   ${AUDIT_EXPORT_SIGNING_KEY_ID:audit-export-key-dev}
# -----------------------------------------------------------------------------

logging:
  level:
    root: INFO

# =============================================================================
# Profile: local
#
# Developer convenience only. Turns the OpenAPI/Swagger surface on and makes it public so a
# developer can browse the API at http://localhost:8080/swagger-ui.html without a key. This block
# is committed (unlike the git-ignored application-local.yml) so the local docs behavior is
# consistent and version-controlled. It changes NOTHING outside the 'local' profile — the default
# profile keeps docs disabled and non-public.
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: local
audit:
  docs:
    enabled: true
    public: true
