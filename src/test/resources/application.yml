# Test-only configuration. These API keys are NON-PRODUCTION, used solely by the test suite
# to exercise authentication/authorization. They are not real secrets.
spring:
  profiles:
    active: test   # enables the ephemeral export dev-key fallback (Ed25519Signer fail-closed policy)
audit:
  security:
    api-keys:
      - key: test-writer-key
        role: WRITER
      - key: test-compliance-key
        role: COMPLIANCE_READER
      - key: test-admin-key
        role: ADMIN
  compliance:
    client-account-resource-type: CLIENT_ACCOUNT
